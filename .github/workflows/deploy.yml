name: Deploy to GitHub Pages

on:
  # Deploy every time you push to main
  push:
    branches: [main]
  # Allow running it manually from the Actions tab
  workflow_dispatch:

# Permissions the deploy job needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        # Installs dependencies from package-lock.json, runs `npm run build`
        # and uploads dist/ as the Pages artifact.
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
